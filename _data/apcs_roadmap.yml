# APCS 初級學習地圖：八個階段
# problems 的題號會自動連到評測系統（judge_base 在 apcs_problems.yml）
# 每個階段可標 site（該階段預設的評測網站），跨站題目寫成 "zjudge-a693" 這種格式
# articles 為對應的教學文章

- stage: 1
  site: sssh
  title: 讓程式跑起來
  goal: 能用 input() 讀資料、用 print() 把結果印出來，程式跑得動、不報錯
  topics: [輸入輸出]
  problems: [a033, a007, a012, a013, a014, a046]
  articles:
    - title: "APCS初級前的基礎題單：從0開始的Python 62題分類清單與線上評測連結"
      url: /2026/10/apcs-beginner-problem-list.html
    - title: "APCS初級課程：Python的print 和 input 輸入輸出基礎教學"
      url: /2025/12/python-print-input-tutorial.html

- stage: 2
  site: sssh
  title: 算得動
  goal: 熟悉變數指派與四則運算，知道 // 取商、% 取餘、整數與浮點數的差別
  topics: [算術運算, 文字分割]
  problems: [a048, a049, a124, a050, a056, a019, a071, a072, a054, a070, a015, a042, a076, a075, a077, a029, a035]
  articles:
    - title: "APCS初級課程：Python的變數與算術運算教學"
      url: /2025/12/python-variables-arithmetic-tutorial.html

- stage: 3
  site: sssh
  title: 會分支
  goal: 寫得出 if／elif／else，理解同一批輸入要依條件走不同的路
  topics: [條件判斷, 條件判斷（字串）]
  problems: [a024, a031, a061, a055, a067, a020, a021, a051, a060, a062, a063, a064, a065, a066, a022, a079, a081, a082, a083, a080, a023]
  articles:
    - title: "APCS初級課程：Python的條件判斷觀念教學，讓你的程式學會做決策！"
      url: /2025/12/python-conditional-judgment-tutorial.html

- stage: 4
  site: sssh
  title: 會重複
  goal: 用 for 與 while 把重複的動作執行多次，能畫出三角形與 99 乘法表
  topics: [迴圈, 巢狀迴圈]
  problems: [a025, a028, a038, a101, a092, a097, a093, a099, a094, a096, a030, a039]
  articles:
    - title: "APCS初級課程：Python的迴圈介紹與使用"
      url: /2025/12/python-loop-introduction.html

- stage: 5
  site: sssh
  title: 迴圈應用
  goal: 用迴圈處理一些經典題目：質數、最大公因數與因數分解。並且進行大量的基礎刷題，徹底學會迴圈與巢狀迴圈
  topics: [迴圈, 條件迴圈]
  problems: [a089, a088, a104, a090, a098, a119, a120, a008, a043, a110, a002]
  articles:
    - title: "APCS初級課程：Python的迴圈介紹與使用"
      url: /2025/12/python-loop-introduction.html

- stage: 6
  site: sssh
  title: 串列與字串
  goal: 練習串列輸入、內建功能，以及與迴圈結合。把字串當成一串可以索引、切段的資料處理，學會用 for 走過每一個字，以及字串切片法。
  topics: [串列, 字串]
  problems: [a122, a107, a110, a010, a126, zjudge-a009]
  articles:
    - title: "APCS初級、中級課程：Python的字串處理與串列"
      url: /2025/12/python-string-list-introduction.html

- stage: 7
  site: sssh
  title: APCS初級範例題
  goal: 活用1~6所學，刷完基礎題庫後，就來挑戰初級範例題吧
  topics: [APCS初級實作]
  problems: [zjudge-g275, zjudge-o711, zjudge-m931]
  articles:
    - title: "APCS初級 七言對聯解題教學"
      url: /2026/10/apcs-qiyan-duilian.html
    - title: "APCS初級 裝飲料解題教學"
      url: /2026/10/apcs-o711-pour-drink.html
    - title: "APCS初級 遊戲選角解題教學"
      url: /2026/10/apcs-game-character-selection.html

- stage: 8
  site: sssh
  title: 函數與遞迴
  goal: 把重複的步驟包成函式，再學會用遞迴把大問題拆成小問題自己呼叫自己
  topics: [遞迴]
  problems: [a095, zjudge-e357, zjudge-d487, zjudge-a227]
  articles:
    - title: "APCS中級課程：Python自訂函數基礎介紹"
      url: /2025/12/custom-functions-introduction.html
    - title: "APCS中級課程：Python的遞迴函數基礎教學"
      url: /2025/12/python-recursion.html
